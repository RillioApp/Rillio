# Standalone workspace: native-only (Tauri pulls url >=2.5, like the streaming
# server), isolated from the root wasm workspace. Build from this directory.
[workspace]

[package]
name = "rillio-desktop"
version = "0.1.44"
edition = "2021"
description = "Rillio desktop shell (Tauri) embedding the Rust streaming server"
license = "gpl-2.0"

[lib]
name = "rillio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The stream_cb cancellation / worker-guard tests stand up their own
# multi-threaded runtime (the flavor production uses); the library itself only
# needs a `runtime::Handle`, so this stays out of [dependencies].
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# The download tests (src/download.rs) stand up a local range-capable HTTP
# server. Same axum line the streaming server already pulls in.
axum = "0.8"

[dependencies]
tauri = { version = "2", features = [] }
# Verifies large model downloads (src/download.rs). Already in the tree via
# the torrent engine.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The Rust streaming server, embedded in-process (S1). No container/sidecar.
rillio-streaming-server = { path = "../../../crates/streaming-server", default-features = false }
# Open URLs / files in the OS default handler (S2 external-player fallback).
open = "5"
# Dynamically load libmpv-2.dll at runtime (S3). Hand-declared FFI against the
# stable libmpv v2 ABI -> no dev headers/import-lib, DLL-agnostic.
libloading = "0.8"
# Decode + downscale + re-encode mpv's screenshot for the player-menu backdrop
# (shell::player_snapshot): mpv writes a full-resolution PNG, we hand the web a
# <=320px JPEG. png+jpeg only - no other codec is ever touched here.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The snapshot crosses the Tauri IPC as a `data:image/jpeg;base64,...` URL, which
# the web layer can drop straight into an <img src>.
base64 = "0.22"
# The mpv stream_cb byte plane (src/stream_cb.rs) drives a librqbit FileStream
# synchronously from mpv's demuxer threads: it needs a `runtime::Handle` to
# block_on, the AsyncRead/AsyncSeek extension traits, Notify for cancellation
# and `time::timeout` for the tail prefetch. Same tokio Tauri already pulls in.
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "time"] }
# Subtitle auto-sync (src/autosync.rs): speech detection over the audio a
# shadow mpv decodes around the current position. The WebRTC VAD is a small C
# library (no model file) built by cc at compile time - the detector ffsubsync
# defaults to. Nothing else here does DSP.
webrtc-vad = "0.4"

# Desktop-only Tauri plugins. None exist on Android: single-instance is
# desktop-only; the updater is replaced by the app store; deep links use a
# different (manifest-driven) mechanism on Android. Gated out of the Android
# build; the `install_update`/deep-link code in lib.rs is `cfg(desktop)` to match.
[target.'cfg(not(target_os = "android"))'.dependencies]
# Self-update: check GitHub Releases for a newer signed build, download + verify
# (minisign) + install. The web UI surfaces the "update available" toast (via an
# emitted event) and calls back into the `install_update` command.
tauri-plugin-updater = "2"
# Single-instance guard: a second launch would fail to bind the streaming
# server's :11470 and fight over the shared WebView2 profile, so instead we
# focus the already-running window and let the second process exit. The
# `deep-link` feature makes it forward a deep link opened while we're already
# running to the running instance (fires the deep-link plugin's on_open_url).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# OS deep links: register stremio:// (ecosystem links, e.g. stremio-addons.net
# "Install" buttons) and rillio:// (canonical) so clicking one opens Rillio and
# navigates. Schemes + installer registration are configured in tauri.conf.json;
# we forward each opened URL to the web client (see lib::queue_or_emit_deep_link).
tauri-plugin-deep-link = "2"
# Generated subtitles (src/transcribe.rs): whisper.cpp through whisper-rs,
# built from source by cmake at compile time (CPU inference; the model file is
# downloaded on first use, never bundled). Desktop-only: the Android port has
# no cmake toolchain wired up and no CPU budget for it anyway.
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
# The dub's two ONNX models (docs/dubbing/stage1-pipeline): dialogue
# separation (src/separate.rs, BS-RoFormer on ONNX Runtime's DirectML
# provider) and the GE2E speaker encoder (src/turns.rs, CPU provider).
# `load-dynamic`: nothing is linked at build time; onnxruntime.dll +
# DirectML.dll travel in the dub pack and are loaded from its directory at
# runtime (one runtime per process: ort keeps the first path it is given).
# `api-24`: the pack is ONNX Runtime 1.24 (the onnxruntime-directml wheel's
# DLL), and ort refuses a runtime older than the API generation its feature
# selects, so this feature tracks the shipped DLL, not ort's default (27).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "tracing", "load-dynamic", "directml", "api-24"] }
# Real-input FFT for the separator's STFT/iSTFT (kept outside the ONNX
# export: no complex-tensor lowering) and the speaker encoder's mel frames.
realfft = "3.5"
# Fetches the whisper model from Hugging Face on first use, streaming to disk
# with progress. rustls so no system TLS surprises; same 0.12 line the updater
# already pulls in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Streams the download body chunk by chunk (reqwest's `bytes_stream`).
futures-util = "0.3"

# whisper.cpp is compiled by cmake at the Rust profile's opt-level; unoptimised
# inference is ~10x slower, which would make a dev shell's "Generate" useless
# and its timings meaningless. Always build it optimised.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[target.'cfg(windows)'.dependencies]
# Win32 HWND for mpv `wid` embedding + child-window z-order (S3/S4). Already in
# Tauri's tree.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # Version-resource APIs (GetFileVersionInfoW/VerQueryValueW) for the
    # stale-image self-heal: read what the exe ON DISK would run.
    "Win32_Storage_FileSystem",
    # Job object with KILL_ON_JOB_CLOSE for the dub pack's GPU sidecars
    # (src/sidecar.rs): they die with the shell even when it crashes.
    # Threading is needed for IO_COUNTERS inside the job's limit struct,
    # Security for the SECURITY_ATTRIBUTES in CreateJobObjectW's signature.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }
# WebView2 COM interfaces (same 0.38.x wry already pins, so the types unify
# with what PlatformWebview::controller() returns). Used solely to set the
# profile's tracking-prevention level to None (see disable_tracking_prevention
# in lib.rs): wry never sets ICoreWebView2EnvironmentOptions5::
# EnableTrackingPrevention, so the feature is force-ON and --disable-features
# names cannot turn it off - the profile property is the only switch we can
# reach without forking wry.
webview2-com = "0.38"

[target.'cfg(target_os = "android")'.dependencies]
# The Android surface seam (surface.rs `android` module): receive the video
# Surface jobject from Kotlin (SurfaceBridge), hold it as a JNI global ref (its
# pointer is libmpv's `wid` on Android), and capture the JavaVM for the ffmpeg
# handoff. NOTE: ndk-context is deliberately NOT used - its singleton is never
# initialized in Tauri's mobile flow (tao/wry keep their own) and
# android_context() aborts the process (found the hard way, SIGABRT on launch).
jni = "0.21"
